[package]
name = "stillwater-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "stillwater_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
shakmaty = "0.27"
shakmaty-syzygy = "0.25"
rustc-hash = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
